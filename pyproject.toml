[project]
name = "epyhia"
version = "0.1.0"
description = "An agency staffed by agents"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai==2.22.0",
    "logfire==4.39.0",
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0",
    "alembic",
    "asyncpg",
    "jinja2",
    "pyyaml",
    "httpx",
    "stripe",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epyhia"]
