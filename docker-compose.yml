services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: epyhia
      POSTGRES_PASSWORD: epyhia
      POSTGRES_DB: epyhia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epyhia"]
      interval: 2s
      timeout: 2s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build: .
    command: uvicorn epyhia.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://epyhia:epyhia@postgres:5432/epyhia
      SMTP_HOST: mailpit
      MAILPIT_API_URL: http://mailpit:8025
      # A local, self-issued token with nothing behind it to protect — same posture as
      # POSTGRES_PASSWORD above — shared with `worker` so `require_sink_token` has something
      # to compare the publish adapter's bearer against.
      SINK_TOKEN: epyhia-dev-sink-token
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m epyhia.queue.worker
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://epyhia:epyhia@postgres:5432/epyhia
      SMTP_HOST: mailpit
      MAILPIT_API_URL: http://mailpit:8025
      # The publish adapter's `execute()`/`verify()` run here, and `localhost` inside this
      # container means the worker container, not `web` — `.env`'s `SINK_BASE_URL` is right
      # for everything running on the host but wrong across the compose network, the same gap
      # SMTP_HOST/MAILPIT_API_URL already close for SMTP.
      SINK_BASE_URL: http://web:8000/sink
      SINK_TOKEN: epyhia-dev-sink-token
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
