<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Specimen Works</title>
<style>
:root{--ink:#1b1a17;--paper:#faf7f2;--accent:#c2410c;--muted:#6f6a61;
--display:"Playfair Display",serif;--body:"Work Sans",sans-serif}
body{margin:0;background:#faf7f2;color:#1b1a17;font-family:var(--body);font-size:1rem;
line-height:1.6}
h1,h2{font-family:var(--display);font-weight:400}
h1{font-size:clamp(3rem,7vw,5.5rem);line-height:0.94}
h2{font-size:2rem}
.hero{background:#1b1a17;color:#faf7f2;padding:16vh 6vw 9vh}
.lede{max-width:22ch}
.measure{max-width:34rem;margin:0 auto;padding:12vh 6vw}
.gallery{max-width:76rem;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);
gap:1px;padding:6vh 0}
.rule{border-top:1px solid #6f6a61}
.tag{border-radius:999px;border:1px solid #6f6a61;padding:2px 10px}
.plate{border-radius:2px;background:#efe9e0;padding:5vh 2vw}
.mark{color:#c2410c}
.band{background:#1b1a17;color:#faf7f2;padding:9vh 6vw}
.band a{color:#c2410c}
.note{color:#6f6a61}
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>Specimen<br>Works</h1>
    <p class="lede">A page that answers to a brand document rather than to a habit.</p>
  </section>
  <section class="manifesto">
    <div class="measure">
      <h2>The premise</h2>
      <p>Sections are allowed to be different sizes. This one is a reading column and the
      next one is not.</p>
      <p class="rule"></p>
    </div>
  </section>
  <section class="index">
    <div class="gallery">
      <div class="plate"><span class="tag">One</span></div>
      <div class="plate"><span class="tag">Two</span></div>
      <div class="plate"><span class="tag">Three</span></div>
    </div>
  </section>
  <section class="process">
    <div class="measure">
      <h2>The <span class="mark">order</span> of it</h2>
      <p class="note">Written for the lint, and for nobody else.</p>
    </div>
  </section>
  <section class="contact">
    <div class="band">
      <h2>Say something</h2>
      <p><a href="#top">Back to the top</a></p>
    </div>
  </section>
</main>
</body>
</html>
